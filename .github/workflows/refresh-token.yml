name: Refresh Instagram token

on:
  schedule:
    # Tous les 45 jours, largement avant l'expiration à 60 jours.
    - cron: "0 6 1,15 * *" # les 1er et 15 de chaque mois (fréquence prudente)
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Renouveler le jeton auprès de Meta
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          RESPONSE=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          echo "Réponse Meta: $RESPONSE"
          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$NEW_TOKEN" = "null" ] || [ -z "$NEW_TOKEN" ]; then
            echo "Échec du renouvellement du jeton. Vérifie IG_ACCESS_TOKEN manuellement."
            exit 1
          fi

          echo "new_token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour le secret IG_ACCESS_TOKEN
        env:
          # PAT (classic, scope "repo") créé manuellement une fois et stocké
          # comme secret séparé, avec le droit d'écrire les secrets du repo.
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          gh secret set IG_ACCESS_TOKEN --body "${{ steps.refresh.outputs.new_token }}" --repo "${{ github.repository }}"

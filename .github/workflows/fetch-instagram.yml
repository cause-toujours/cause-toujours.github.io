name: Fetch Instagram feed

on:
  schedule:
    # Tous les jours à 6h00 UTC. Ajuste si besoin.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # permet de le lancer manuellement depuis l'onglet Actions

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les derniers posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node fetch-instagram.mjs

      - name: Commit et push si changement
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json data/instagram-pin-options.json
          # le snapshot épinglé n'existe que si un post est forcé via le CMS
          if [ -f data/instagram-pinned.json ]; then
            git add data/instagram-pinned.json
          fi
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: mise à jour du flux Instagram"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

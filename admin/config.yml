# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: cause-toujours/cause-toujours.github.io
  branch: main
  base_url: https://sveltia-cms-auth.basile-mart.workers.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "homepage"
    label: "Page d'accueil"
    label_singular: "Contenu du site"
    delete: false
    files:
      - file: "_data/homepage.json"
        name: "homepage"
        label: "Contenu du site"
        format: "json"
        fields:
          # --- META ---
          - name: "meta"
            label: "informations navigateur"
            widget: "object"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Titre de l'onglet", hint: "Texte affiché dans l'onglet du navigateur et dans les résultats Google", widget: "string" }
              - { name: "description", label: "Description (référencement)", hint: "Texte court affiché par Google sous le titre du site", widget: "text" }

          # --- HERO ---
          - name: "hero"
            label: "1. En-tête (haut de page)"
            widget: "object"
            summary: "{{fields.title}}"
            fields:
              - { name: "sticker", label: "Petite étiquette", hint: "Texte du sticker au-dessus du titre (ex: NOUVEAU MÉDIA)", widget: "string" }
              - { name: "title", label: "Titre principal", hint: "Le nom du média en gros", widget: "string" }
              - { name: "title_bang", label: "Point d'exclamation", hint: "Symbole après le titre (généralement !)", widget: "string" }
              - { name: "subtitle", label: "Sous-titre", hint: "Phrase d'accroche sous le titre", widget: "string" }
              - { name: "baseline", label: "Baseline", hint: "Description en une ligne", widget: "text" }
              - { name: "cta_primary_text", label: "Bouton principal — texte", hint: "Texte du gros bouton (ex: SOUTENIR / S'ABONNER)", widget: "string" }
              - { name: "cta_primary_link", label: "Bouton principal — lien", hint: "Où mène le bouton (#soutenir pour aller à la section abonnements)", widget: "string" }
              - { name: "cta_secondary_text", label: "Bouton secondaire — texte", hint: "Texte du deuxième bouton", widget: "string" }
              - { name: "cta_secondary_link", label: "Bouton secondaire — lien", widget: "string" }
              - { name: "scroll_text", label: "Texte d'invitation à défiler", hint: "Petit texte sous les boutons", widget: "string" }
              - name: "badge_lines"
                label: "Badge (lignes)"
                hint: "Texte du badge rond sur la couverture — une ligne par entrée"
                widget: "list"
                minimize_collapsed: true
              - { name: "dateline_date", label: "Folio — date d'édition", hint: "Affichée en rouge dans la barre du haut (ex: Septembre 2026)", widget: "string" }
              - { name: "dateline_num", label: "Folio — numéro", hint: "Affiché dans la barre du haut (ex: N°001)", widget: "string" }
              - name: "kraft_bar"
                label: "Bandeau rouge"
                hint: "Textes qui défilent dans la barre rouge sous l'en-tête — une entrée par texte (le numéro et la date sont déjà dans le folio au-dessus)"
                widget: "list"
                minimize_collapsed: true
              - { name: "cover_image", label: "Image de couverture", hint: "Nom du fichier image (ex: journal-cover.png)", widget: "string" }
              - { name: "cover_alt", label: "Description de l'image", hint: "Texte affiché si l'image ne charge pas (accessibilité)", widget: "string" }

          # --- MANIFESTE ---
          - name: "manifeste"
            label: "1. Manifeste"
            widget: "object"
            summary: "{{fields.section_title_1}}"
            fields:
              - { name: "section_num", label: "Numéro de section", widget: "string" }
              - { name: "section_title_1", label: "Titre (ligne 1)", widget: "string" }
              - { name: "section_title_2", label: "Titre (ligne 2)", widget: "string" }
              - { name: "section_tag", label: "Étiquette", hint: "Petit texte à côté du titre", widget: "string" }
              - { name: "dropcap", label: "Paragraphe d'ouverture", hint: "Le premier paragraphe avec la grande lettrine. Vous pouvez utiliser du gras/italique.", widget: "markdown" }
              - name: "paragraphs"
                label: "Paragraphes du manifeste"
                hint: "Ajoutez, supprimez ou réordonnez les paragraphes"
                widget: "list"
                minimize_collapsed: true
                summary: "{{fields.text}}"
                field: { name: "text", label: "Paragraphe", widget: "markdown" }
              - { name: "aside_label", label: "Étiquette du lien externe", hint: "Texte du ruban à droite", widget: "string" }
              - { name: "aside_text", label: "Texte du lien externe", hint: "Vous pouvez mettre du gras/italique grâce aux boutons de mise en forme.", widget: "markdown" }
              - { name: "aside_link_text", label: "Texte du bouton", widget: "string" }
              - { name: "aside_link_url", label: "URL du lien", widget: "string" }
              - { name: "pull_quote", label: "Citation forte", hint: "La phrase mise en avant en bas à droite", widget: "markdown" }

          # --- SOUTENIR ---
          - name: "soutenir"
            label: "2. Soutenir (abonnements & dons)"
            widget: "object"
            summary: "{{fields.section_title_1}}"
            fields:
              - { name: "section_num", label: "Numéro de section", widget: "string" }
              - { name: "section_title_1", label: "Titre (ligne 1)", widget: "string" }
              - { name: "section_title_2", label: "Titre (ligne 2)", widget: "string" }
              - { name: "section_tag", label: "Étiquette", widget: "string" }
              - name: "formules"
                label: "Formules d'abonnement / don"
                hint: "Les trois cartes de soutien. Pour mettre une carte en avant, cochez 'Mettre en avant'."
                widget: "list"
                minimize_collapsed: true
                summary: "{{fields.tape}}"
                fields:
                  - { name: "tape", label: "Étiquette de la carte", hint: "Texte en haut de la carte (ex: LECTEUR, ABONNÉ)", widget: "string" }
                  - { name: "price", label: "Prix", hint: "Montant affiché en gros (ex: 8€, 40€, Libre)", widget: "string" }
                  - { name: "price_unit", label: "Unité", hint: "Texte petit sous le prix (ex: /numéro, /an · 6 n°)", widget: "string" }
                  - { name: "desc", label: "Description", hint: "Texte explicatif de la formule", widget: "text" }
                  - { name: "button_text", label: "Texte du bouton", widget: "string" }
                  - { name: "button_link", label: "Lien du bouton", hint: "URL Yapla ou # pour plus tard", widget: "string" }
                  - { name: "highlight", label: "Mettre en avant", hint: "Cochez pour la carte 'MEILLEUR CHOIX' (fond coloré)", widget: "boolean", default: false }
                  - { name: "flag", label: "Drapeau", hint: "Texte du drapeau (ex: MEILLEUR CHOIX). Laisser vide si pas de drapeau.", widget: "string", default: "", required: false }
              - { name: "transparency_title", label: "Titre transparence", hint: "Titre de la section 'Où va votre argent'", widget: "string" }
              - name: "transparency_bars"
                label: "Répartition des dépenses"
                hint: "Les barres qui montrent où va l'argent"
                widget: "list"
                minimize_collapsed: true
                summary: "{{fields.pct}} — {{fields.label}}"
                fields:
                  - { name: "pct", label: "Pourcentage", widget: "string" }
                  - { name: "label", label: "Libellé", widget: "string" }
              - { name: "transparency_note", label: "Note de transparence", hint: "Phrase en bas de la section", widget: "markdown" }
              - { name: "adresse_label", label: "Étiquette adresse", widget: "string" }
              - { name: "adresse_text", label: "Texte adresse", hint: "Info sur la collecte d'adresse postale", widget: "text" }

          # --- DERNIER NUMÉRO ---
          - name: "numero"
            label: "3. Dernier numéro"
            widget: "object"
            summary: "{{fields.section_title_1}}"
            fields:
              - { name: "section_num", label: "Numéro de section", widget: "string" }
              - { name: "section_title_1", label: "Titre (ligne 1)", widget: "string" }
              - { name: "section_title_2", label: "Titre (ligne 2)", widget: "string" }
              - { name: "section_tag", label: "Étiquette", hint: "Texte affiché sous l'image de la Une (ex: Tous les 2 mois, une thématique passée au crible)", widget: "string" }
              - { name: "preview_tape", label: "Étiquette aperçu", hint: "Texte sur l'aperçu de la Une", widget: "string" }
              - { name: "preview_image", label: "Image aperçu", hint: "Nom du fichier image (ex: journal-page3.png)", widget: "string" }
              - { name: "preview_image_alt", label: "Description de l'image", hint: "Texte affiché si l'image ne charge pas (accessibilité)", widget: "string" }
              - { name: "mini_edito_label", label: "Mini édito — titre de l'encart", hint: "Texte en haut de l'édito réduit (ex: MINI ÉDITO · N°001)", widget: "string" }
              - { name: "mini_edito_intro", label: "Mini édito — paragraphe d'ouverture", hint: "Le premier paragraphe de l'édito, avec la grande lettrine. Vous pouvez utiliser du gras/italique.", widget: "markdown" }
              - name: "mini_edito_paragraphs"
                label: "Mini édito — paragraphes"
                hint: "Ajoutez, supprimez ou réordonnez les paragraphes"
                widget: "list"
                minimize_collapsed: true
                summary: "{{fields.text}}"
                field: { name: "text", label: "Paragraphe", widget: "markdown" }
              - { name: "mini_edito_outro", label: "Mini édito — phrase de sortie", hint: "Invitation vers le papier (ex: À découvrir en version longue dans le dernier numéro papier de Cause Toujours !)", widget: "string" }
              - { name: "poster_tape", label: "Affiche — ruban", hint: "Texte en haut de l'affiche poster (ex: POSTER A2 · N°001)", widget: "string" }
              - { name: "poster_artist", label: "Affiche — nom de l'artiste", hint: "Ex: STBF", widget: "string" }
              - { name: "poster_artist_url", label: "Affiche — lien de l'artiste", hint: "URL vers la page/l'insta de l'artiste (ex: https://www.instagram.com/stbf97/)", widget: "string" }
              - { name: "poster_image", label: "Affiche — image", hint: "Nom du fichier image (ex: poster-a2-n001.png)", widget: "string" }
              - { name: "poster_image_alt", label: "Affiche — description de l'image", hint: "Texte affiché si l'image ne charge pas (accessibilité)", widget: "string" }
              - { name: "poster_caption", label: "Affiche — légende", hint: "Phrase sous l'affiche (ex: Chaque numéro inclut un poster A2 signé par un·e artiste engagé·e.)", widget: "text" }
              - { name: "crossword_title", label: "Mots croisés — titre de l'encart", hint: "Titre de l'encart réponse (ex: MOTS CROISÉS · N°001). Laisser l'image vide pour masquer tout l'encart.", widget: "string", required: false }
              - { name: "crossword_intro", label: "Mots croisés — phrase d'intro", hint: "Petite phrase au-dessus de l'image (ex: Tu as joué dans le #1 ? Vérifie tes réponses.)", widget: "string", required: false }
              - { name: "crossword_image", label: "Mots croisés — image de la solution", hint: "Nom du fichier image (ex: mots-croises-n001.jpeg). Laisser vide pour masquer l'encart.", widget: "string", required: false }
              - { name: "crossword_image_alt", label: "Mots croisés — description de l'image", hint: "Texte affiché si l'image ne charge pas (accessibilité)", widget: "string", required: false }
              - { name: "crossword_reveal_text", label: "Mots croisés — texte du bouton", hint: "Message affiché sur l'image floutée (ex: Cliquez pour révéler la réponse)", widget: "string", required: false }
              - name: "ig_tape_label"
                label: "Étiquette ruban Instagram"
                hint: "Texte du ruban kraft au-dessus du dernier post (ex: DERNIER POST · INSTAGRAM)"
                widget: "string"
              - name: "ig_override_post_id"
                label: "Post Instagram affiché"
                hint: "Laissez vide pour le dernier post automatique. Sinon, choisissez parmi les derniers posts du compte (identifiés par leur légende)."
                widget: "relation"
                collection: "homepage"
                file: "instagram"
                value_field: "{{posts.*.id}}"
                search_fields: ["{{posts.*.caption}}"]
                display_fields: ["{{posts.*.caption}}"]
                required: false
              - { name: "ig_intro", label: "Texte sous le post Instagram", hint: "Petite phrase sous l'aperçu du dernier post", widget: "text" }

          # --- OÙ NOUS RETROUVER ---
          - name: "trouver"
            label: "4. Points de vente"
            widget: "object"
            summary: "{{fields.section_title_1}}"
            fields:
              - { name: "section_num", label: "Numéro de section", widget: "string" }
              - { name: "section_title_1", label: "Titre (ligne 1)", widget: "string" }
              - { name: "section_title_2", label: "Titre (ligne 2)", widget: "string" }
              - { name: "section_tag", label: "Étiquette", widget: "string" }
              - { name: "coming_soon_text", label: "Message principal", hint: "Texte annonçant l'arrivée prochaine du journal en points de vente", widget: "string" }
              - { name: "contact_title", label: "Titre d'appel", hint: "Première phrase d'invitation à devenir point de vente", widget: "string" }
              - { name: "contact_text", label: "Texte d'appel", hint: "Deuxième phrase d'invitation", widget: "string" }
              - { name: "contact_email", label: "Email de contact", hint: "Adresse email où écrire pour devenir point de vente", widget: "string" }
              - { name: "contact_button_text", label: "Texte du bouton", widget: "string" }

          # --- QUI SOMMES-NOUS ---
          - name: "qui"
            label: "5. Qui sommes-nous"
            widget: "object"
            summary: "{{fields.section_title_1}}"
            fields:
              - { name: "section_num", label: "Numéro de section", widget: "string" }
              - { name: "section_title_1", label: "Titre (ligne 1)", widget: "string" }
              - { name: "section_title_2", label: "Titre (ligne 2)", widget: "string" }
              - { name: "section_tag", label: "Étiquette", widget: "string" }
              - name: "paragraphs"
                label: "Paragraphes de présentation"
                widget: "list"
                minimize_collapsed: true
                summary: "{{fields.text}}"
                field: { name: "text", label: "Paragraphe", widget: "markdown" }
              - { name: "social_title", label: "Titre réseaux sociaux", widget: "string" }
              - { name: "social_text", label: "Texte réseaux sociaux", widget: "markdown" }
              - { name: "social_link_text", label: "Lien réseau — texte", widget: "string" }
              - { name: "social_link_url", label: "Lien réseau — URL", widget: "string" }
              - { name: "engagement_title", label: "Titre engagement", hint: "Titre du bloc 'Prendre la plume' (ex: PRENDRE LA PLUME)", widget: "string" }
              - { name: "engagement_text", label: "Texte engagement", hint: "Invitation à contribuer", widget: "markdown" }
              - { name: "engagement_button_text", label: "Bouton engagement — texte", widget: "string" }
              - { name: "engagement_email", label: "Adresse email rédaction", hint: "Adresse qui s'ouvre dans le logiciel de mail quand on clique sur 'Écrire à la rédaction' (ex: redaction@montpelliercausecommune.org)", widget: "string" }
              - { name: "cc_label", label: "Étiquette Cause Commune", widget: "string" }
              - { name: "cc_name", label: "Nom Cause Commune", widget: "string" }
              - { name: "cc_detail", label: "Détail Cause Commune", widget: "string" }

          # --- FOOTER ---
          - name: "footer"
            label: "8. Pied de page"
            widget: "object"
            summary: "{{fields.logo}}"
            fields:
              - { name: "logo", label: "Logo (texte)", widget: "string" }
              - { name: "logo_bang", label: "Bang", widget: "string" }
              - { name: "text", label: "Texte pied de page", widget: "string" }
              - { name: "cc_logo", label: "Logo Cause Commune (fichier)", hint: "Nom du fichier image (ex: logo-cc.png)", widget: "string" }
              - { name: "cc_logo_alt", label: "Logo Cause Commune — description", hint: "Texte affiché si l'image ne charge pas (accessibilité)", widget: "string" }
              - name: "bar_items"
                label: "Éléments de la barre"
                hint: "Textes séparés par des points dans le pied de page"
                widget: "list"
                minimize_collapsed: true

      # --- MANIFESTE (page dédiée) ---
      - file: "_data/manifeste.json"
        name: "manifeste"
        label: "Le Manifeste"
        format: "json"
        fields:
          - { name: "titre", label: "Titre principal", widget: "string" }
          - { name: "sous_titre", label: "Sous-titre", widget: "string" }
          - name: "sections"
            label: "Sections"
            widget: "list"
            hint: "Chaque section = un titre + son contenu. Ajoutez, supprimez ou réordonnez."
            summary: "{{fields.titre}}"
            minimize_collapsed: true
            fields:
              - { name: "titre", label: "Titre de la section", widget: "string" }
              - { name: "contenu", label: "Contenu", hint: "Vous pouvez mettre du gras/italique grâce aux boutons de mise en forme.", widget: "markdown" }

      # --- FLUX INSTAGRAM (options pour la liste déroulante) ---
      # Fichier généré automatiquement par l'Action GitHub fetch-instagram
      # (id + légende uniquement). Sert uniquement de source à la liste
      # déroulante "Post Instagram affiché" (widget relation). Il sera
      # réécrit à chaque synchronisation du flux.
      - file: "data/instagram-pin-options.json"
        name: "instagram"
        label: "Posts Instagram (auto)"
        format: "json"
        fields:
          - { name: "updatedAt", label: "Date de sync", widget: "hidden", required: false }
          - name: "posts"
            label: "Posts"
            widget: "list"
            fields:
              - { name: "id", label: "ID", widget: "hidden", required: false }
              - { name: "caption", label: "Légende", widget: "string" }
